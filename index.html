<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>커피 레시피 라이브러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2ED;--sf:#FFFFFF;--sf2:#EFEAE3;--ink:#1D1A17;--mut:#7A7167;--line:#E6E0D7;--acc:#C8571B;--accsoft:#FBE9DD;--ice:#2B7BD0;--icesoft:#E3EFFB;--ok:#2F8F5B;--warn:#B7791F;--warnsoft:#FBF0D9;--sh:0 1px 2px rgba(29,26,23,.05),0 10px 28px rgba(29,26,23,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#14110F;--sf:#1F1B18;--sf2:#2B2521;--ink:#F4EEE6;--mut:#A39A8F;--line:#342E29;--acc:#F59A5E;--accsoft:#3A2518;--ice:#7DBBF5;--icesoft:#182838;--ok:#6CC796;--warn:#E7B55B;--warnsoft:#33280F;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
.num,.stats b,.hero b,.tm{font-family:Inter,"Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,b,.r2n,.r2a,.hint,.note,.tg,.st>div,label,summary{overflow-wrap:anywhere;word-break:keep-all}
.sh-h>div:first-child,.r2t,.it-h>div:first-child{min-width:0;flex:1}
.seg button{white-space:normal;line-height:1.25;min-width:0;padding:9px 4px}
.hero{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero b{font-size:clamp(22px,8vw,30px);overflow-wrap:anywhere}
.hero .tm2{font-size:clamp(17px,5.5vw,24px)!important;line-height:1.25}
.st>div:last-child{min-width:0}
.st b.num{max-width:55%;text-align:right;overflow-wrap:anywhere}
.row.r3>*{min-width:92px}
.row>*{min-width:min(120px,100%)}
main{max-width:680px;margin:0 auto;padding:22px 18px 130px}
h1.hd{font-size:30px;line-height:1.2;letter-spacing:-.03em;font-weight:700;margin:6px 0 18px}
h2.t{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.02em;margin:26px 2px 10px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
textarea{min-height:130px;font-size:14px;line-height:1.5}
label{display:block;font-size:12px;font-weight:500;color:var(--mut);margin:12px 2px 6px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round}
.search input{padding-left:44px;height:50px;border-radius:16px;box-shadow:var(--sh);border-color:transparent}
.seg{display:flex;background:var(--sf2);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:11px;font-size:14px;font-weight:500;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--sf);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.ice{color:var(--ice)}
.ctl{display:grid;gap:10px;margin:16px 0 4px}
.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--sh)}
.stepper button{width:38px;height:38px;border-radius:50%;border:0;background:var(--sf2);font-size:20px;line-height:1;font-weight:500}
.stepper b{min-width:76px;text-align:center;font-weight:700}
.chip{border:1px solid var(--line);background:var(--sf);border-radius:18px;padding:7px 14px;font-size:14px;font-weight:500;max-width:100%;white-space:normal;text-align:left;line-height:1.35;overflow-wrap:anywhere}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.acc.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hint{font-size:13px;color:var(--mut)}
.hint b{color:var(--ink)}
details.box{background:var(--sf);border-radius:20px;box-shadow:var(--sh);margin:16px 0;padding:0}
details.box>summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"＋";color:var(--mut);font-weight:400}
details.box[open]>summary::after{content:"－"}
details.box .in{padding:0 18px 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scr{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 4px}
.frow{margin:12px 0}.frow .fl{font-size:12px;font-weight:500;color:var(--mut);margin:0 2px 6px}
.item{background:var(--sf);border-radius:22px;padding:18px;margin:12px 0;box-shadow:var(--sh);cursor:pointer;transition:transform .12s}
.item:active{transform:scale(.985)}
.item.dim{opacity:.55}
.it-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.it-t{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.it-s{font-size:13px;color:var(--mut);margin-top:2px}
.cmpbtn{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sf);font-size:18px;line-height:1;color:var(--mut)}
.cmpbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px;background:var(--bg);border-radius:16px;padding:12px 6px}
.stats>div{text-align:center}
.stats b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.stats b small{font-size:11px;font-weight:600;color:var(--ice)}
.stats span{font-size:11px;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tg{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--sf2);color:var(--mut)}
.tg.ok{background:var(--accsoft);color:var(--acc)}.tg.warn{background:var(--warnsoft);color:var(--warn)}.tg.ice{background:var(--icesoft);color:var(--ice)}
.why{margin-top:10px;font-size:13px;color:var(--ok);font-weight:500}
.row2{display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:16px;padding:14px 14px 14px 18px;margin:8px 0;box-shadow:var(--sh);cursor:pointer}
.row2:active{background:var(--sf2)}.row2.dim{opacity:.55}
.r2t{flex:1;min-width:0}.r2a{font-size:12px;color:var(--mut);font-weight:500}
.r2n{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.row2 .why{margin-top:4px}
.chev{color:var(--mut);font-size:22px;line-height:1}
.row2 .cmpbtn{width:32px;height:32px;font-size:16px}
.srow{display:grid;grid-template-columns:62px 78px 1fr 34px;gap:6px;margin:6px 0;align-items:center}
.srow input{padding:10px 8px;border-radius:12px;font-size:14px}.srow .x{width:34px;height:34px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;display:none;box-shadow:var(--sh)}
.fav{flex:none;width:32px;height:32px;border:0;background:none;font-size:22px;line-height:1;color:var(--mut)}.fav.on{color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav#nav button{flex:1;max-width:120px;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--mut);font-size:11px;font-weight:600}
nav#nav button.on{color:var(--acc)}
nav#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#pill{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:19;pointer-events:none}
#pill button{pointer-events:auto;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px;box-shadow:var(--sh)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:13px 20px;font-weight:700;font-size:15px}
.btn.acc{background:var(--acc);color:#fff}
.btn.g{background:var(--sf2);color:var(--ink)}
.btn.s{padding:9px 14px;font-size:13px;border-radius:12px}
.btn.w{width:100%}
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet .bd{position:absolute;inset:0;background:rgba(20,16,12,.5);backdrop-filter:blur(3px)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sh-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-h h3{margin:0;font-size:24px;line-height:1.25;letter-spacing:-.03em}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--sf2);font-size:16px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 10px}
.hero>div{background:var(--sf);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.hero b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.hero b small{font-size:14px;font-weight:600;color:var(--ice);letter-spacing:0}
.hero span{font-size:12px;color:var(--mut)}
.hero .big{background:var(--ink);color:var(--bg)}.hero .big span{color:inherit;opacity:.65}
.tl{background:var(--sf);border-radius:22px;padding:4px 18px;box-shadow:var(--sh);margin-top:14px}
.st{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.st:last-child{border:0}
.tm{font-size:15px;font-weight:700;color:var(--acc)}
.wc{display:inline-block;background:var(--accsoft);color:var(--acc);border-radius:999px;padding:1px 10px;font-weight:700;font-size:14px;margin-right:8px}
.note{border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px;background:var(--sf2)}
.note.i{background:var(--icesoft);color:var(--ice)}.note.w{background:var(--warnsoft);color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.card{background:var(--sf);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500}.cmp td:first-child{color:var(--mut);white-space:nowrap;font-size:13px}
.scroll{overflow-x:auto}
pre{background:var(--sf2);padding:12px;border-radius:12px;overflow:auto;font-size:12px}
</style>
</head>
<body>
<main id="v"></main>
<div id="pill"></div><div id="toast"></div>
<nav id="nav"></nav>
<div id="sheet"><div class="bd" data-act="close"></div><div class="pn" id="pn"></div></div>

<script>

const ROASTN={light:'라이트',medlight:'미디엄 라이트',medium:'미디엄',meddark:'미디엄 다크',dark:'다크'};
const STYLEN={clarity:'선명·산미',sweet:'단맛',body:'바디감',balanced:'균형',easy:'쉬운 레시피'};
const PROCN={washed:'워시드',natural:'내추럴',honey:'허니',anaerobic:'무산소 발효',other:'기타'};

const PROCD={washed:0,natural:-1,honey:0,anaerobic:-2,other:0};
const SERV_G=250;                       // 브루잉 1인분 = 완성 음료 약 250g
const CAP={'V60':600,'Kalita Wave':500,'AeroPress':230,'French Press':1000,'Chemex':1000,'Origami':600}; // 1회 권장 최대 물(g)

/* ============ 시드 데이터 ============
 conf: 'high' = 널리 알려진 값 / 'check' = 일반값·기억 기반이라 원본 대조 필요
 category=brew: water=총 물(g) / espresso·manual: water=추출량(g, 출력)
 steps[].to = 누적 물(g)  */
const SEED=[
{id:'hoffmann-v60',name:'Ultimate V60 Technique',author:'James Hoffmann',category:'brew',device:'V60',dose:30,water:500,temp:100,grind:'중간~약간 고운',time:'약 3:30',
 steps:[{t:'0:00',to:60,note:'블룸: 가루 전체를 적시고 스월'},{t:'0:45',to:300,note:'중앙에서 천천히 이어서 주입'},{t:'1:15',to:500,note:'남은 물 전량 주입'},{t:'1:45',note:'스푼으로 가볍게 젓고 스월 → 드로다운'}],
 roastFit:['light','medlight','medium'],style:['clarity','balanced'],ice:true,conf:'check',source:'YouTube: The Ultimate V60 Technique',notes:'스텝 타이밍은 영상과 대조 필요.'},
{id:'kasuya-46',name:'4:6 Method',author:'Tetsu Kasuya',category:'brew',device:'V60',dose:20,water:300,temp:92,grind:'굵게',time:'3:30',
 steps:[{t:'0:00',to:60,note:'1투 (앞 40%: 산미/단맛 밸런스)'},{t:'0:45',to:120,note:'2투'},{t:'1:30',to:180,note:'3투 (뒤 60%: 농도 조절)'},{t:'2:15',to:240,note:'4투'},{t:'3:00',to:300,note:'5투 → 드로다운 3:30 전후'}],
 roastFit:['light','medlight','medium','meddark'],style:['sweet','balanced','easy'],ice:true,conf:'high',source:'2016 WBrC 우승 메소드',notes:'로스팅이 밝으면 온도↑, 어두우면 온도↓가 원칙. 앞 40%=맛 밸런스, 뒤 60%=농도.'},
{id:'rao-v60',name:'Rao V60 (연속 주입)',author:'Scott Rao',category:'brew',device:'V60',dose:20,water:333,temp:100,grind:'중간',time:'3:00~3:30',
 steps:[{t:'0:00',to:60,note:'블룸: 도즈의 약 3배, 스월'},{t:'0:45',to:333,note:'부드럽게 연속 주입'},{t:'2:30',note:'스월 후 평평한 베드로 드로다운'}],
 roastFit:['light','medlight','medium'],style:['balanced','sweet'],ice:true,conf:'check',source:'Rao 레시피 (일반 정리)',notes:'수치는 일반 정리값 — 원문 대조 필요.'},
{id:'hoffmann-aeropress',name:'Ultimate AeroPress (인버티드)',author:'James Hoffmann',category:'brew',device:'AeroPress',dose:11,water:200,temp:100,grind:'중간~약간 고운',time:'2:30',
 steps:[{t:'0:00',to:200,note:'인버티드 세팅, 물 전량 붓고 3회 젓기, 필터캡'},{t:'2:00',note:'뒤집어서 천천히 압착 (약 30초)'}],
 roastFit:['light','medlight','medium','meddark'],style:['balanced','easy'],ice:true,conf:'high',source:'YouTube: The Ultimate AeroPress Technique',notes:''},
{id:'hoffmann-fp',name:'Ultimate French Press',author:'James Hoffmann',category:'brew',device:'French Press',dose:30,water:500,temp:100,grind:'중간~굵게',time:'약 9~10분',
 steps:[{t:'0:00',to:500,note:'물 전량 붓고 4분 대기'},{t:'4:00',note:'표면 크러스트를 저어 풀고 거품/가루 걷어내기'},{t:'4:00~',note:'5~8분 더 가라앉힌 뒤 누르지 않고 따라냄'}],
 roastFit:['medium','meddark','dark'],style:['body','easy'],ice:false,conf:'high',source:'YouTube: The Ultimate French Press Technique',notes:''},
{id:'esp-classic',name:'클래식 1:2 기준 레시피',author:'기준값(일반)',category:'espresso',device:'에스프레소 머신',dose:18,water:36,temp:93,grind:'에스프레소 곱게 (시간으로 다이얼링)',time:'25~30초',pressure:'9 bar',

 roastFit:['medium','meddark','dark'],style:['balanced','body'],ice:true,conf:'high',source:'일반 기준',notes:'시작점. 신맛이 날카로우면 비율/시간↑, 쓰면 비율↓/분쇄 굵게.'},
{id:'esp-light',name:'라이트 로스트 긴 비율 1:2.5',author:'기준값(일반)',category:'espresso',device:'에스프레소 머신',dose:18,water:45,temp:95,grind:'기준보다 약간 곱게',time:'30~35초',pressure:'6~9 bar',
 steps:[{t:'0:00',note:'긴 프리인퓨전(선택)'},{t:'~32s',note:'출력 45g 도달 시 종료'}],
 roastFit:['light','medlight'],style:['clarity','sweet'],ice:true,conf:'check',source:'일반 경향',notes:'원두마다 편차 큼.'},
{id:'esp-ristretto',name:'리스트레토 1:1.5',author:'기준값(일반)',category:'espresso',device:'에스프레소 머신',dose:18,water:27,temp:92,grind:'곱게',time:'20~25초',pressure:'9 bar',
 steps:[{t:'0:00',note:'추출 시작'},{t:'~22s',note:'출력 27g 도달 시 종료'}],
 roastFit:['meddark','dark'],style:['body'],ice:false,conf:'check',source:'일반',notes:'밀크 음료용 진한 샷.'},
{id:'flair58-base',name:'Flair 58 기본 레시피',author:'기준값(일반)',category:'manual',device:'Flair 58',dose:18,water:36,temp:93,grind:'에스프레소 곱게',time:'30~40초',pressure:'6~9 bar (게이지 보며)',

 {k:'category',label:'종류',get:r=>[CATN[r.category]]},
 {k:'device',label:'기구',get:r=>[r.device]},
 {k:'author',label:'바리스타 · 출처',get:r=>[r.author]},

function matchF(r){
  const ra=r.water/r.dose;

  for(const f of FACETS){

function tempFor(r,bean){
  if(!bean)return r.temp;
  const d=(ROASTD[bean.roast]||0)+(PROCD[bean.process]||0);
  return Math.max(80,Math.min(r.category==='brew'?100:97,r.temp+d));
}
function calc(r,o={}){
  const isBrew=r.category==='brew',iced=S.ice;
  let total,dose,shots=1;
  if(isBrew){
    if(o.dose){dose=o.dose;total=r.water*dose/r.dose}
    else if(r.perServ){total=S.serv*r.water;dose=r.dose*S.serv}
    else{total=S.serv*SERV_G;dose=r.dose*total/r.water}
  }else{dose=o.dose||r.dose;total=r.water*dose/r.dose;shots=S.serv}
  let hot=total,ice=0;
  if(iced&&isBrew&&!r.mode){ice=total*S.icePct/100;hot=total-ice}
  const sf=hot/r.water,cap=CAP[r.device];
  return {isBrew,iced,total,dose,hot,ice,shots,sf,temp:tempFor(r,curBean()),cap,over:isBrew&&cap&&hot>cap,
    steps:(r.steps||[]).map(s=>({...s,to:s.to!=null?s.to*sf:null}))};
}

function wantStyles(t){

  if(/초콜릿|초코|견과|아몬드|헤이즐넛|카라멜|캐러멜|너티|묵직|바디|토피|코코아|choco|nut|caramel|toffee|cocoa|cacao|body/i.test(t))w.push('body');
  if(/꿀|설탕|시럽|단맛|단 맛|honey|sugar|syrup|sweet/i.test(t))w.push('sweet');
  return w;
}
function score(r,bean){
  let s=0;const why=[];
  if(!bean)return {s:r.conf==='high'?1:0,why};
  if((r.roastFit||[]).includes(bean.roast)){s+=3;why.push(ROASTN[bean.roast]+' 배전에 적합')}
  wantStyles(bean.notes).forEach(x=>{if((r.style||[]).includes(x)){s+=2;why.push('컵노트 → '+STYLEN[x]+' 지향')}});
  return {s,why};
}

function calcInput(t){
  const k=t.id.slice(2),c=CALC,v=t.value;
  if(k==='dose'){c.dose=+v||0;c.water=r1(c.dose*c.ratio);$('#c_water').value=c.water}

}

function normT(t){return t.replace(/(\d+)\s*['′’]\s*(\d{2})\s*(?:["″”])?/g,'$1:$2').replace(/℃/g,'°C')}
function parseText(t0){
  const t=normT(t0);
  const L=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const num=m=>m?parseFloat(m[1]||m[2]):null;
  const r={id:'a-'+Date.now()+Math.random().toString(36).slice(2,5),name:'',author:'',category:'brew',device:'',dose:null,water:null,temp:null,grind:'',time:'',steps:[],roastFit:[],style:[],ice:true,conf:'own',source:'직접 입력',notes:''};
  r.name=(L[0]&&!/^\d+:\d{2}/.test(L[0]))?L[0].replace(/^[#■◆▶●\-*\[\s]+|[\]\s]+$/g,'').slice(0,60):'새 레시피';
  const au=t.match(/(?:바리스타|작성자|출처|author)\s*[:：]\s*([^\n,]+)/i)||t.match(/\bby\s+([^\n,]+)/i);if(au)r.author=au[1].trim();
  const dd=t.match(/드리퍼\s*[:：]\s*([^/\n]+)/);if(dd)r.device=dd[1].trim();
  const dev=[[/v60|브이\s*60/i,'V60'],[/칼리타|kalita/i,'Kalita Wave'],[/에어로\s*프레스|aeropress/i,'AeroPress'],[/프렌치\s*프레스|french/i,'French Press'],[/케멕스|chemex/i,'Chemex'],[/오리가미|origami/i,'Origami'],[/플레어|flair/i,'Flair'],[/에스프레소|espresso|샷/i,'에스프레소 머신']].find(([re])=>re.test(t));
  if(dev){if(!r.device)r.device=dev[1];if(dev[1]==='Flair'){r.category='manual';r.device=/58/.test(t)?'Flair 58':'Flair'}else if(dev[1]==='에스프레소 머신')r.category='espresso'}
  if(/플레어|flair|수동\s*에스프레소|lever|레버/i.test(t)){r.category='manual';if(!r.device)r.device='수동 에스프레소'}
  r.dose=num(t.match(/(?:원두|커피|도즈|\bdose\b|\bcoffee\b)\s*[:：]?\s*(\d+(?:\.\d+)?)\s*g|(\d+(?:\.\d+)?)\s*g\s*(?:의\s*)?(?:원두|커피|coffee)/i));
  r.water=num(t.match(/(?:총\s*물량|물량|물|\bwater\b|추출량|\byield\b|출력|액량)\s*[:：]?\s*(\d+(?:\.\d+)?)\s*(?:g|ml)|(\d+(?:\.\d+)?)\s*(?:g|ml)\s*(?:의\s*)?(?:물|water)/i));
  const ra=t.match(/1\s*:\s*(\d+(?:\.\d+)?)/);
  if(r.dose&&!r.water&&ra)r.water=Math.round(r.dose*parseFloat(ra[1])*10)/10;
  r.temp=num(t.match(/(\d{2,3})\s*(?:°\s*C|°|도|c\b)/i));
  const tm=t.match(/(?:총|시간|time|추출\s*시간)\s*[:：]?\s*[~약]?\s*(\d+:\d{2}|\d+\s*초|\d+\s*분)/i);if(tm)r.time=(/~/.test(t.slice(tm.index,tm.index+tm[0].length))?'~':'')+tm[1];
  const gr=t.match(/(?:분쇄|그라인드|grind)[^\n:：]*[:：]?\s*([^\n]+)/i);if(gr)r.grind=gr[1].trim();
  if(/라이트|light|약배전/i.test(t))r.roastFit.push('light');if(/미디엄|medium|중배전/i.test(t))r.roastFit.push('medium');if(/다크|dark|강배전/i.test(t))r.roastFit.push('dark');
  const raw=[];
  L.forEach(l=>{const m=l.match(/^(\d+:\d{2}|\d+\s*초)\s*[-–:~)]?\s*(.*)$/);if(m){const rest=m[2];const g=rest.match(/(\+?)\s*(\d+(?:\.\d+)?)\s*(?:g|ml)/i);const t2=rest.match(/^(\d+:\d{2})/);
    raw.push({t:m[1],g:g?parseFloat(g[2]):null,plus:g?!!g[1]:false,note:t2?t2[1]+'까지 주입':rest.replace(/\d+(?:\.\d+)?\s*(?:g|ml)/i,'').trim()})}});
  if(raw.some(x=>x.plus)){let sum=0;r.steps=raw.map(x=>{const o={t:x.t,note:x.note};if(x.g!=null){sum=x.plus?sum+x.g:x.g;o.to=sum}return o})}
  else{const gs=raw.map(x=>x.g).filter(x=>x!=null);const cum=gs.every((v,i)=>i===0||v>gs[i-1]);let sum=0;
    r.steps=raw.map(x=>{const o={t:x.t,note:x.note};if(x.g!=null){if(cum)o.to=x.g;else{sum+=x.g;o.to=sum}}return o})}
  if(r.category==='brew'&&!r.water&&r.steps.length){const l=[...r.steps].reverse().find(s=>s.to!=null);if(l)r.water=l.to}
  return r;
}
/* 여러 섹션(■ HOT / ■ ICE / 그라인더 표 / DIAL IN)이 섞인 글을 레시피 여러 개로 분리 */
function parseMulti(text){
  const t=normT(text);
  const parts=t.split(/\n(?=\s*[■◆▶●]\s)/);
  if(parts.length<2)return [parseText(text)];
  const head=/^\s*[■◆▶●]/.test(parts[0])?'':parts.shift();
  const hl=head.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const title=(hl[0]||'').replace(/[\[\]]/g,'');
  const am=title.match(/(.+?)\s*레시피/);const author=am?am[1].trim():'';
  const dev=(head.match(/드리퍼\s*[:：]\s*([^/\n]+)/)||[])[1],filt=(head.match(/필터\s*[:：]\s*([^/\n]+)/)||[])[1],flow=(head.match(/유량\s*[:：]\s*([^\n]+)/)||[])[1];
  const isRec=p=>/^\s*[■◆▶●]/.test(p)&&p.split(/\n/).some(l=>/^\s*\d+:\d{2}/.test(l))&&/(\d\s*g)/.test(p);
  const recs=parts.filter(isRec),others=parts.filter(p=>!isRec(p));
  let grows=[],gnote='',cols=null,dial=[],dtemp=null;
  others.forEach(p=>{
    const lines=p.split(/\n/).map(x=>x.trim()).filter(Boolean);
    const hi=lines.findIndex(l=>/ICE.*HOT|HOT.*ICE/i.test(l));
    if(hi>=0){cols=/ICE/i.test(lines[hi])&&lines[hi].search(/ICE/i)<lines[hi].search(/HOT/i)?['ice','hot']:['hot','ice'];
      lines.slice(hi+1).forEach(l=>{if(/^※/.test(l)){gnote=l;return}const c=l.split(/\t|\s{2,}/);if(c.length>=3)grows.push({name:c[0],[cols[0]]:c[1],[cols[1]]:c[2]})})}
    else if(/DIAL|다이얼\s*인|보정/i.test(lines[0]||'')){dial=lines.slice(1).map(l=>l.replace(/^[-•]\s*/,''));const tm=dial.join(' ').match(/(\d{2,3})\s*°C/);if(tm)dtemp=+tm[1]}
  });
  const dialTxt=[];dial.forEach(l=>{if(/^(시간이|길면|짧으면)/.test(l)&&dialTxt.length)dialTxt[dialTxt.length-1]+=' → '+l;else dialTxt.push(l)});
  return recs.map(p=>{
    const r=parseText(p.replace(/^\s*[■◆▶●]\s*/,''));
    const first=p.split(/\n/)[0];
    const mode=/ice|아이스/i.test(first)?'ice':/hot|핫/i.test(first)?'hot':'';
    if(mode){r.mode=mode;r.perServ=true;r.ice=mode==='ice'}
    if(author)r.author=author;if(dev)r.device=dev.trim();
    if(r.temp==null&&dtemp)r.temp=dtemp;
    r.notes=[filt?'필터 '+filt.trim():'',flow?'유량 '+flow.trim():'',...dialTxt].filter(Boolean).join(' · ');
    if(grows.length&&mode){r.grinders=grows.map(g=>({name:g.name,v:g[mode]||''}).valueOf());if(gnote)r.grinderNote=gnote}
    r.source=(author||'직접 입력')+' 레시피';
    return r;
  });
}

function readAdd(i,author){
  const g=k=>{const e=$('#a'+i+'_'+k);return e?e.value.trim():''},n=k=>parseFloat(g(k))||0;

  const rec={...ADDS[i],name:g('name'),author:author??g('author'),category:g('category'),device:g('device'),dose:n('dose'),water:n('water'),temp:n('temp')||93,time:g('time'),grind:g('grind'),notes:g('notes'),steps};
  const m=g('mode');if(m){rec.mode=m;rec.perServ=true;rec.ice=m==='ice'}else{delete rec.mode;delete rec.perServ}
  return rec;
}

  else if(a==='fav'){const ids=pairOf(byId(id)).map(x=>x.id);if(isFav(byId(id)))S.favs=S.favs.filter(x=>!ids.includes(x));else S.favs.push(...ids);st.set('cr_favs',S.favs);refreshAll()}
  else if(a==='erevert'){delete S.ov[D.id];st.set('cr_ov',S.ov);refreshAll();toast('원본으로 되돌렸습니다')}
  else if(a==='eedit'){D.edit=true;renderSheet();setTimeout(()=>{const e=$('#e_name');if(e){e.focus();e.select()}},30)}
  else if(a==='ecancel'){D.edit=false;renderSheet()}
  else if(a==='esave'){
    const name=$('#e_name').value.trim(),author=$('#e_author').value.trim();
    if(!name||!author){toast('이름과 카페·바리스타를 입력하세요');return}
    const r=byId(D.id),targets=(author!==r.author&&r.pair)?pairOf(r):[r];
    targets.forEach(t=>{const patch=t.id===r.id?{name,author}:{author};
      if(S.custom.some(x=>x.id===t.id))S.custom=S.custom.map(x=>x.id===t.id?{...x,...patch}:x);else S.ov[t.id]={...(S.ov[t.id]||{}),...patch}});
    st.set('cr_custom',S.custom);st.set('cr_ov',S.ov);D.edit=false;refreshAll();toast('수정했습니다')}
  else if(a==='favonly'){S.favOnly=!S.favOnly;refreshBrowse()}
  else if(a==='edit')loadCalc(D.id);
  else if(a==='del'){if(!D.delArm){D.delArm=true;renderSheet();return}
    S.custom=S.custom.filter(x=>x.id!==D.id);S.compare=S.compare.filter(x=>x!==D.id);st.set('cr_custom',S.custom);closeSheet();refreshAll();toast('삭제했습니다')}
  else if(a==='ccat'){CALC.category=v;CALC.ratio=v==='brew'?16:2;CALC.water=r1(CALC.dose*CALC.ratio);if(v!=='brew'&&CALC.device==='V60')CALC.device=v==='manual'?'Flair 58':'에스프레소 머신';if(v==='brew'&&/에스프레소|Flair/.test(CALC.device))CALC.device='V60';renderCalc()}
  else if(a==='cratio'){CALC.ratio=+v;CALC.water=r1(CALC.dose*CALC.ratio);$('#c_ratio').value=r2(CALC.ratio);$('#c_water').value=CALC.water;refreshCalc()}
  else if(a==='croast'){CALC.roast=CALC.roast===v?'':v;refreshCalc()}
  else if(a==='cproc'){CALC.process=CALC.process===v?'':v;refreshCalc()}
  else if(a==='capply'){CALC.temp=+v;$('#c_temp').value=v;refreshCalc()}
  else if(a==='sadd'){CALC.steps.push({t:'',to:'',note:''});$('#cst').innerHTML=stepsHTML()}
  else if(a==='sdel'){CALC.steps.splice(+v,1);$('#cst').innerHTML=stepsHTML();refreshCalc()}
  else if(a==='sclr'){CALC.steps=[];$('#cst').innerHTML=stepsHTML();refreshCalc()}
  else if(a==='sgen'){const n=Math.max(1,Math.min(12,+$('#g_n').value||4)),gi=Math.max(5,+$('#g_i').value||45);
    CALC.steps=Array.from({length:n},(_,i)=>({t:fmtT(i*gi),to:r1(CALC.water*(S.ice&&CALC.category==='brew'?1-S.icePct/100:1)*(i+1)/n),note:(i+1)+'투'}));$('#cst').innerHTML=stepsHTML();refreshCalc()}
  else if(a==='csave')calcSave(false);
  else if(a==='cover')calcSave(true);
  else if(a==='chip'){const k=el.dataset.k;S.f[k]=S.f[k]||new Set();S.f[k].has(v)?S.f[k].delete(v):S.f[k].add(v);refreshBrowse()}
  else if(a==='mode'){S.mode=v;refreshBrowse()}
  else if(a==='reset'){S.f={};S.q='';S.rmin='';S.rmax='';renderBrowse()}
  else if(a==='roast'){S.b.roast=S.b.roast===v?'':v;st.set('cr_b',S.b);refreshHome()}
  else if(a==='proc'){S.b.process=S.b.process===v?'':v;st.set('cr_b',S.b);refreshHome()}
  else if(a==='bean-save'){
    if(!S.b.roast){$('#beanbox').open=true;return}
    const x={...S.b,id:'b-'+Date.now()};if(!x.name)x.name=ROASTN[x.roast]+(x.process?' · '+PROCN[x.process]:'');
    S.beans.push(x);st.set('cr_beans',S.beans);refreshHome();
  }
  else if(a==='bean-clear'){S.b={};st.set('cr_b',S.b);renderHome()}
  else if(a==='bean-pick'){const x=S.beans.find(y=>y.id===id);if(x){S.b={...x};st.set('cr_b',S.b);renderHome()}}
  else if(a==='combo')makeCombo();
  else if(a==='parse'){ADDS=parseMulti($('#free').value);renderAdd()}
  else if(a==='add-save')saveAdd(+v);
  else if(a==='add-all')saveAll();
  else if(a==='copy'){const t=$('#exp');t.select();try{navigator.clipboard.writeText(t.value)}catch(x){}}
  else if(a==='import')doImport();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='hq'){S.hq=t.value;refreshHome()}
  else if(t.id==='q'){S.q=t.value;refreshBrowse()}
  else if(t.id==='rmin'){S.rmin=t.value;refreshBrowse()}
  else if(t.id==='rmax'){S.rmax=t.value;refreshBrowse()}
  else if(t.id&&t.id.startsWith('c_')&&t.id!=='c_load')calcInput(t);
  else if(t.dataset.k&&t.dataset.i!==undefined){const x=CALC.steps[+t.dataset.i];x[t.dataset.k]=t.dataset.k==='to'?(t.value===''?'':+t.value):t.value;refreshCalc()}
  else if(t.id&&t.id.startsWith('b_')){S.b[t.id.slice(2)]=t.value;st.set('cr_b',S.b);if(t.id==='b_notes')refreshHome()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sort'){S.sort=t.value;refreshBrowse()}
  else if(t.id==='c_load'){if(t.value)loadCalc(t.value);else{CALC=newCalc();renderCalc()}}
  else if(t.dataset.chg==='dose'){D.dose=+t.value||null;renderSheet()}
  else if(t.dataset.chg==='icePct'){S.icePct=Math.max(0,Math.min(80,+t.value||0));savePrefs();refreshAll()}
  else if(t.dataset.chg==='pick'){S.picks[t.dataset.f]=+t.value}
});
render();
</script>
</body>
